# Имя проекта задано явно: на хосте с несколькими compose-проектами имя по
# умолчанию берётся из названия каталога, и контейнеры/тома чужих сервисов
# могут случайно совпасть с нашими.
name: threads-api

services:
  api:
    build: .
    restart: unless-stopped
    # Потолок памяти — «забор» после инцидента 2026-07-21 (контейнер без лимита
    # вызвал host-wide OOM, ядро убило mongod соседнего проекта). Внутри живёт
    # браузерный профиль, поэтому запас больше обычного.
    mem_limit: 2g
    memswap_limit: 3g
    env_file: .env
    environment:
      # Внутри контейнера порт всегда 8080 — эта сеть наша, конфликтовать не с чем.
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /var/lib/threads-api
    volumes:
      - state:/var/lib/threads-api
    # Наружу — только петлевой интерфейс хоста и порт из .env.
    # TLS и маршрутизацию делает хостовый nginx.
    ports:
      - "${API_BIND_ADDR:-127.0.0.1}:${API_BIND_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Графический сеанс для ручного логина в Threads.
  # Поднимается только по требованию: docker compose --profile login up -d novnc
  # Перед этим освободи профиль: POST /browser/suspend
  novnc:
    profiles: ["login"]
    image: mcr.microsoft.com/playwright:v1.50.0-noble
    restart: "no"
    # Тот же «забор», что и у api: графический браузер легко раздувается.
    mem_limit: 2g
    memswap_limit: 3g
    environment:
      DISPLAY: ":99"
    volumes:
      - state:/var/lib/threads-api
      - ./deploy/login-session.sh:/usr/local/bin/login-session.sh:ro
    ports:
      - "${API_BIND_ADDR:-127.0.0.1}:${NOVNC_BIND_PORT:-16080}:6080"
    command: ["bash", "/usr/local/bin/login-session.sh"]

volumes:
  state:
