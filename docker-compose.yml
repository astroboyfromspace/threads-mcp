services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /var/lib/threads-api
    volumes:
      - state:/var/lib/threads-api
    # Наружу не публикуется: доступ только через Caddy.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      NOVNC_USER_HASH: ${NOVNC_USER_HASH}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Графический сеанс для ручного логина в Threads.
  # Поднимается только по требованию: docker compose --profile login up -d novnc
  # Перед этим освободи профиль: POST /browser/suspend
  novnc:
    profiles: ["login"]
    image: mcr.microsoft.com/playwright:v1.50.0-noble
    restart: "no"
    environment:
      DISPLAY: ":99"
    volumes:
      - state:/var/lib/threads-api
      - ./deploy/login-session.sh:/usr/local/bin/login-session.sh:ro
    expose:
      - "6080"
    command: ["bash", "/usr/local/bin/login-session.sh"]

volumes:
  state:
  caddy_data:
  caddy_config:
